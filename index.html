<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#10142b"><meta name="description" content="Небесный вызов — аркадный прыжок вверх!">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png">
<title>Небесный вызов</title>
<style>
:root{--bg:#10142b;--panel:#1b2344;--line:#46568a;--pink:#ff68bd;--cyan:#56e5ff;--gold:#ffd66b}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overscroll-behavior:none}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);display:flex;justify-content:center}
#app{width:min(100%,520px);height:100dvh;max-height:950px;display:flex;flex-direction:column;padding:10px 12px;gap:9px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px}
.logo{font-weight:1000;letter-spacing:.4px;font-size:clamp(17px,4vw,22px)}.sub{font-size:10px;color:#aebbe8;letter-spacing:1.5px}
.pills{display:flex;gap:6px}.pill{background:#202b50;border:1px solid #3b4a77;border-radius:12px;padding:7px 9px;font-weight:800;font-size:13px;white-space:nowrap}
#stage{position:relative;flex:1;min-height:280px;border:2px solid #485b91;border-radius:20px;overflow:hidden;box-shadow:0 12px 40px #0006;background:#15254a}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;font-weight:900;text-shadow:0 2px 5px #111}
#overlay{position:absolute;inset:0;background:linear-gradient(#0b1027c9,#121a35eF);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px}
#overlay.hidden{display:none}.hero{font-size:60px;filter:drop-shadow(0 8px 12px #0008)}h1{font-size:clamp(24px,7vw,34px);margin:5px 0 7px;line-height:1.05}.desc{color:#c3ccef;font-size:13px;max-width:290px;line-height:1.5;margin-bottom:17px}
button{border:0;color:#fff;font:inherit;font-weight:850;cursor:pointer;touch-action:manipulation}
.primary{padding:13px 23px;border-radius:14px;background:linear-gradient(135deg,#9b62ff,#e45fc5);box-shadow:0 5px 0 #663eaa,0 9px 22px #9b62ff55}
.controls{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:116px}
#joyArea{width:126px;height:112px;position:relative;touch-action:none;display:grid;place-items:center}
#joyBase{width:106px;height:106px;border-radius:50%;background:radial-gradient(circle at 35% 25%,#425783,#1b284d 70%);border:2px solid #6b80b4;box-shadow:inset 0 5px 15px #0a102a,0 5px 15px #0005;position:relative}
#joyKnob{position:absolute;width:48px;height:48px;border-radius:50%;left:27px;top:27px;background:linear-gradient(145deg,#fff,#93caff 60%,#5d7bda);box-shadow:0 4px 12px #0009;border:2px solid #e4f4ff;transform:translate(0,0)}
.actionBtns{display:flex;flex-direction:column;gap:8px;flex:1}
.action{border-radius:13px;padding:12px 10px;background:linear-gradient(135deg,#27375f,#1d294c);border:1px solid #526b9c;font-size:13px}
.action.shop{background:linear-gradient(135deg,#7845bc,#bd4f9e);border:0}
#shop{position:absolute;inset:0;background:#0a1025f5;z-index:5;padding:14px;overflow:auto;display:none}
#shop.open{display:block}.shopHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.shopHead h2{margin:0;font-size:22px}
.tabs{display:flex;gap:6px;overflow:auto;padding-bottom:9px}.tab{padding:9px 11px;border-radius:10px;background:#253354;white-space:nowrap;font-size:12px}.tab.active{background:#9b62ff}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.item{border:1px solid #3d4c75;border-radius:15px;padding:10px;background:linear-gradient(145deg,#222e54,#18213e);text-align:center;min-width:0}
.preview{height:72px;display:grid;place-items:center;border-radius:11px;background:radial-gradient(circle,#465b8b,#1a2546);font-size:43px;margin-bottom:8px}
.item b{font-size:13px;display:block}.item small{color:#bdc9e9}.item button{width:100%;margin-top:8px;padding:8px;border-radius:9px;background:#8d5ce3;font-size:12px}.item button:disabled{background:#3c8d76}
.note{text-align:center;font-size:10px;color:#9eadd8}
@media(max-height:650px){#app{gap:5px;padding:6px 9px}.controls{min-height:95px}#joyArea{height:92px}#joyBase{width:88px;height:88px}#joyKnob{left:20px;top:20px}.desc{margin-bottom:9px}}
</style></head>
<body><main id="app">
<header><div><div class="logo">☄ НЕБЕСНЫЙ ВЫЗОВ</div><div class="sub">JUMP • EXPLORE • COLLECT</div></div><div class="pills"><div class="pill">🪙 <span id="coins">0</span></div><div class="pill">🏆 <span id="best">0</span></div></div></header>
<section id="stage"><canvas id="game" width="420" height="720"></canvas><div class="hud"><span id="height">0 м</span><span id="runCoins">+0 🪙</span></div>
<div id="overlay"><div class="hero" id="hero">🦊</div><h1 id="title">ВЫШЕ ОБЛАКОВ!</h1><div class="desc" id="desc">Управляй джойстиком, прыгай по платформам, уворачивайся от существ и собирай звёздные монеты.</div><button class="primary" id="start">НАЧАТЬ ПРЫЖОК</button></div>
<div id="shop"><div class="shopHead"><h2>✨ Гардероб героя</h2><button class="action" id="close">✕</button></div><div style="margin-bottom:10px;color:#d5defc;font-size:13px">Баланс: 🪙 <b id="balance">0</b></div><div class="tabs" id="tabs"></div><div class="grid" id="items"></div></div>
</section>
<section class="controls"><div id="joyArea"><div id="joyBase"><div id="joyKnob"></div></div></div><div class="actionBtns"><button class="action shop" id="openShop">🛍 МАГАЗИН</button><button class="action" id="pause">Ⅱ ПАУЗА</button></div></section>
<div class="note">Держи джойстик влево или вправо • Прогресс сохраняется на устройстве</div>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id),cv=$('game'),cx=cv.getContext('2d'),W=420,H=720;
const catalog={
skin:[['Лисёнок','🦊',0,'#ff9b54'],['Космонавт','🧑‍🚀',55,'#a8e9ff'],['Лунный кот','🐱',90,'#c6a7ff'],['Неон-дракон','🐲',145,'#65f5cf'],['Королевский слизень','👑',190,'#ffdb72'],['Кибер-ниндзя','🥷',240,'#ff79c8']],
world:[['Звёздная ночь','🌌',0],['Сахарный закат','🌅',65],['Ледяная комета','❄️',100],['Галактика','🪐',150]],
platform:[['Мятные','🟩',0],['Неоновые','💠',55],['Кристальные','💎',95],['Золотые','🌟',140]],
monster:[['Прыг-слизни','🟣',0],['Призраки','👻',60],['Космо-жуки','🪲',105],['Пиксельные боты','🤖',155]]
};
let save={coins:0,best:0,owned:{skin:[0],world:[0],platform:[0],monster:[0]},equip:{skin:0,world:0,platform:0,monster:0}};
try{let s=JSON.parse(localStorage.getItem('sky-v2'));if(s)save={...save,...s,owned:{...save.owned,...s.owned},equip:{...save.equip,...s.equip}}}catch(e){}
const persist=()=>{try{localStorage.setItem('sky-v2',JSON.stringify(save))}catch(e){}};
function hud(){ $('coins').textContent=save.coins;$('best').textContent=save.best;$('balance').textContent=save.coins;$('hero').textContent=catalog.skin[save.equip.skin][1]}
hud();
let tab='skin';
function shop(){ $('tabs').innerHTML='';Object.keys(catalog).forEach(k=>{let b=document.createElement('button');b.className='tab '+(tab===k?'active':'');b.textContent=({skin:'🧑 Герои',world:'🌌 Миры',platform:'🧱 Платформы',monster:'👾 Монстры'})[k];b.onclick=()=>{tab=k;shop()};$('tabs').append(b)});
$('items').innerHTML='';catalog[tab].forEach((it,i)=>{let owned=save.owned[tab].includes(i),equipped=save.equip[tab]===i;let d=document.createElement('div');d.className='item';d.innerHTML=`<div class="preview">${it[1]}</div><b>${it[0]}</b><small>${it[2]?'🪙 '+it[2]:'Бесплатно'}</small>`;let b=document.createElement('button');b.textContent=equipped?'Надето':owned?'Надеть':'Купить';b.disabled=equipped;b.onclick=()=>{if(owned)save.equip[tab]=i;else if(save.coins>=it[2]){save.coins-=it[2];save.owned[tab].push(i);save.equip[tab]=i}else{b.textContent='Мало монет';return}persist();hud();shop()};d.append(b);$('items').append(d)})}
$('openShop').onclick=()=>{$('shop').classList.add('open');shop();if(state==='play')pauseGame()};$('close').onclick=()=>$('shop').classList.remove('open');
let state='menu',score=0,earned=0,camera=0,player,plats,mobs,stars,particles=[],last=0,raf=0,axis=0;
function newPlat(y,x){return{x:x??Math.random()*320+20,y,w:62+Math.random()*25,h:13,v:Math.random()<.28?1.1:0,dir:1,break:Math.random()<.13}}
function reset(){score=0;earned=0;camera=0;player={x:195,y:570,vy:-8,vx:0};plats=[{x:150,y:640,w:120,h:14,v:0,dir:1}];let y=580;while(y>-150){plats.push(newPlat(y));y-=75+Math.random()*35}mobs=[];stars=[];for(let i=0;i<6;i++)mobs.push({x:Math.random()*360+25,y:Math.random()*500-100,dir:Math.random()<.5?1:-1});$('runCoins').textContent='+0 🪙'}
function begin(){reset();state='play';$('overlay').classList.add('hidden');$('shop').classList.remove('open');last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function finish(){state='over';save.best=Math.max(save.best,Math.floor(score));persist();hud();$('title').textContent='ПРЫЖОК ЗАВЕРШЁН';$('desc').textContent=`Ты поднялся на ${Math.floor(score)} м и собрал ${earned} монет. Попробуешь ещё раз?`;$('start').textContent='ИГРАТЬ СНОВА';$('hero').textContent='🏅';$('overlay').classList.remove('hidden')}
function pauseGame(){if(state!=='play')return;state='pause';$('title').textContent='ПАУЗА';$('desc').textContent='Передохни. Твой прогресс в этом прыжке сохранён.';$('start').textContent='ПРОДОЛЖИТЬ';$('hero').textContent='⏸️';$('overlay').classList.remove('hidden')}
$('start').onclick=()=>{if(state==='pause'){state='play';$('overlay').classList.add('hidden');last=performance.now();raf=requestAnimationFrame(loop)}else begin()};
$('pause').onclick=()=>{if(state==='play')pauseGame();else if(state==='pause'){$('start').click()}};
const themes=[['#10142b','#263b6c'],['#44234e','#e67b83'],['#102b4b','#5bc3df'],['#090b28','#4b328e']];
function draw(){let t=themes[save.equip.world];let g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,t[0]);g.addColorStop(1,t[1]);cx.fillStyle=g;cx.fillRect(0,0,W,H);
for(let i=0;i<75;i++){let x=(i*97+17)%W,y=(i*139+Math.floor(camera*.28))%H;cx.fillStyle=i%4?'#ffffff8a':'#8ceaff';cx.globalAlpha=.35+(i%4)*.12;cx.beginPath();cx.arc(x,y,i%5===0?2:1,0,7);cx.fill()}cx.globalAlpha=1;
let pc=['#70e6a1','#52e9ff','#a9caff','#ffd66b'][save.equip.platform];
plats.forEach(p=>{let y=p.y-camera;if(y<-25||y>H+20)return;cx.fillStyle=pc;cx.shadowColor=pc;cx.shadowBlur=10;round(cx,p.x,y,p.w,p.h,7);cx.fill();cx.shadowBlur=0;cx.fillStyle='#ffffff80';round(cx,p.x+7,y+2,p.w-14,3,2);cx.fill()});
stars.forEach(s=>{if(s.got)return;let y=s.y-camera;cx.font='23px sans-serif';cx.fillText('✦',s.x,y)});
mobs.forEach(m=>{let y=m.y-camera;if(y<-30||y>H+30)return;let em=['🟣','👻','🪲','🤖'][save.equip.monster];cx.font='27px system-ui';cx.fillText(em,m.x-13,y+9)});
cx.font='38px system-ui';cx.textAlign='center';cx.fillText(catalog.skin[save.equip.skin][1],player.x,player.y-camera+12);cx.textAlign='left'}
function round(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r)}
function loop(now){if(state!=='play')return;let dt=Math.min((now-last)/16.67,2);last=now;
player.vx=axis*5.2;player.x+=player.vx*dt;if(player.x<-20)player.x=W+15;if(player.x>W+20)player.x=-15;let old=player.y;player.vy+=.24*dt;player.y+=player.vy*dt;
plats.forEach(p=>{p.x+=p.v*p.dir*dt;if(p.x<3||p.x+p.w>W-3)p.dir*=-1;if(player.vy>0&&old+12<=p.y&&player.y+12>=p.y&&player.x+12>p.x&&player.x-12<p.x+p.w){player.vy=p.break?-7.5:-9.2;if(p.break)p.y=99999}});
mobs.forEach(m=>{m.x+=m.dir*1.2*dt;if(m.x<15||m.x>405)m.dir*=-1;if(Math.abs(m.x-player.x)<24&&Math.abs(m.y-player.y)<27){finish();return}});
stars.forEach(s=>{if(!s.got&&Math.abs(s.x-player.x)<24&&Math.abs(s.y-player.y)<25){s.got=true;save.coins++;earned++;hud();persist();$('runCoins').textContent='+'+earned+' 🪙'}});
if(state!=='play')return;
if(player.y-camera<260)camera=player.y-260;score=Math.max(score,570-camera);
let min=Math.min(...plats.map(p=>p.y));while(min>camera-120){let y=min-(76+Math.random()*35),p=newPlat(y);plats.push(p);min=y;if(Math.random()<.36)stars.push({x:30+Math.random()*360,y:y-35,got:false});if(Math.random()<.2)mobs.push({x:30+Math.random()*360,y:y-30,dir:Math.random()<.5?1:-1})}
plats=plats.filter(p=>p.y<camera+H+60);mobs=mobs.filter(m=>m.y<camera+H+60);stars=stars.filter(s=>s.y<camera+H+50);
if(player.y-camera>H+35){finish();return}
$('height').textContent=Math.floor(score)+' м';draw();raf=requestAnimationFrame(loop)}
// Analog joystick: displacement maps continuously to -1..1.
const area=$('joyArea'),knob=$('joyKnob');let joyId=null;
function moveJoy(e){let r=area.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),limit=34;dx=Math.max(-limit,Math.min(limit,dx));axis=dx/limit;knob.style.transform=`translate(${dx}px,0px)`}
area.addEventListener('pointerdown',e=>{e.preventDefault();joyId=e.pointerId;area.setPointerCapture(joyId);moveJoy(e)});
area.addEventListener('pointermove',e=>{if(e.pointerId===joyId)moveJoy(e)});
function release(e){if(e.pointerId===joyId){joyId=null;axis=0;knob.style.transform='translate(0,0)'}}
area.addEventListener('pointerup',release);area.addEventListener('pointercancel',release);area.addEventListener('lostpointercapture',release);
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')axis=-1;if(e.key==='ArrowRight'||e.key==='d')axis=1});
window.addEventListener('keyup',e=>{if(['ArrowLeft','ArrowRight','a','d'].includes(e.key))axis=0});
reset();draw();
})();
</script></body></html>
<script>if("serviceWorker" in navigator && location.protocol.startsWith("http"))navigator.serviceWorker.register("./sw.js").catch(()=>{});</script>
